<script>
  // The portrait's backdrop is a field of red data bars. The page paints the
  // same field behind everything so the portrait has no edge to give it away.
  (function () {
    var layer = document.getElementById('bars');
    if (!layer) return;

    var seed = 20260825;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    var cols = 88, out = '';
    for (var c = 0; c < cols; c++) {
      var x = (c / cols) * 100 + rnd() * 0.4;
      var w = 0.10 + rnd() * 0.34;
      var y = rnd() * 100;
      var n = 3 + Math.floor(rnd() * 8);
      for (var i = 0; i < n; i++) {
        var h = 0.5 + rnd() * 6;
        y = (y + h + 2 + rnd() * 13) % 100;
        // a few bright filaments, the rest banked well down
        var hot = rnd() > 0.9;
        out += '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) +
               '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) +
               '" fill="' + (hot ? '#fc0000' : '#cf0101') +
               '"' + (hot ? ' class="hot"' : '') +
               ' style="--o:' + ((hot ? 0.55 : 0.08) + rnd() * 0.38).toFixed(2) +
               (hot ? ';animation-delay:' + (rnd() * 14).toFixed(1) + 's' : '') + '"/>';
      }
    }

    layer.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' + out + '</svg>';
  })();

  // Badges and the name borrow the filaments' failing-tube stutter. Rather
  // than a CSS loop — which locks each element to one shape on a fixed
  // period — every blink picks its own pattern, length and next interval,
  // so the page never settles into a rhythm you can anticipate.
  (function () {
    if (window.matchMedia &&
        matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var seed = 987654321;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    var SHAPES = ['bkA', 'bkB', 'bkC', 'bkD'];

    // minDur/spanDur set how laboured the sign is. The name carries the
    // slowest range — at display size a quick stutter reads as a glitch
    // rather than a tube struggling to light.
    function fire(el, shape, dur) {
      el.style.setProperty('--bdur', dur.toFixed(0) + 'ms');
      el.classList.add('blinking', shape);
      setTimeout(function () {
        el.classList.remove('blinking', shape);
      }, dur + 60);
    }

    function schedule(el, wait, cfg) {
      setTimeout(function () {
        // never glitch under the cursor; it reads as a bug mid-click
        if (el.matches(':hover')) return schedule(el, 900 + rnd() * 1600, cfg);

        var shape = SHAPES[(rnd() * SHAPES.length) | 0];
        var dur = cfg.minDur + rnd() * cfg.spanDur;
        fire(el, shape, dur);

        // a failing sign takes its neighbour with it often enough that
        // letters going strictly one at a time would read as too tidy
        if (cfg.spread && rnd() < 0.28 && el.nextElementSibling) {
          fire(el.nextElementSibling, shape, dur * (0.8 + rnd() * 0.4));
        }

        setTimeout(function () {
          // now and then it fails again right after catching
          schedule(el,
            rnd() < 0.14 ? 380 + rnd() * 900
                         : cfg.minGap + rnd() * cfg.spanGap, cfg);
        }, dur + 60);
      }, wait);
    }

    var TAGS = { minDur: 700, spanDur: 1050, minGap: 5200, spanGap: 21000 };
    var LTRS = { minDur: 950, spanDur: 1150, minGap: 15000, spanGap: 30000,
                 spread: true };

    // opening blinks land in the first seconds so the page shows its hand
    [].forEach.call(document.querySelectorAll('.tag'), function (el, i) {
      schedule(el, i < 5 ? 500 + i * 780 + rnd() * 420 : 1500 + rnd() * 17000,
               TAGS);
    });

    // every letter becomes its own tube, so they fail one at a time instead
    // of the whole word going dark together
    function letters(fly) {
      var text = fly.textContent;
      fly.textContent = '';
      return [].map.call(text, function (ch) {
        var l = document.createElement('span');
        l.className = 'ltr';
        l.textContent = ch;
        fly.appendChild(l);
        return l;
      });
    }

    // Nudge each word's period and starting point per load, so the two are
    // never at the same offset twice and the pair never settles into a
    // recognisable beat. A negative delay starts it already mid-arc.
    [].forEach.call(document.querySelectorAll('.name > span'), function (word) {
      var base = parseFloat(getComputedStyle(word).getPropertyValue('--sway')) || 7.2;
      // Math.random, not the seeded rnd() the bar field uses — that seed is
      // fixed on purpose so the backdrop is identical every load, which is
      // exactly what this should not be.
      var dur = base * (0.88 + Math.random() * 0.24);
      word.style.setProperty('--sway', dur.toFixed(2) + 's');
      word.style.setProperty('--sway-delay', (-Math.random() * dur).toFixed(2) + 's');
    });

    // No waiting on the entrance any more: the sway lives on the word and
    // the fly-in on .fly inside it, so nothing has to be handed over.
    [].forEach.call(document.querySelectorAll('.name .fly'), function (fly, w) {
      letters(fly).forEach(function (l, i) {
        schedule(l, 1800 + w * 900 + i * 520 + rnd() * 2400, LTRS);
      });
    });
  })();

  // An occasional catchlight in his eye. Rare and quick, so it reads as a
  // glint you half-caught rather than a decoration that pulses.
  (function () {
    if (window.matchMedia &&
        matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var glint = document.querySelector('.glint');
    if (!glint) return;

    function twinkle() {
      var dur = 700 + Math.random() * 500;
      glint.style.setProperty('--gdur', dur.toFixed(0) + 'ms');
      glint.classList.add('flash');
      setTimeout(function () {
        glint.classList.remove('flash');
        setTimeout(twinkle, 3200 + Math.random() * 7000);
      }, dur + 50);
    }

    setTimeout(twinkle, 1800 + Math.random() * 2200);
  })();

  // One pointer drives the whole depth stack: the portrait turns to face it
  // while the bar field slides the other way, which is what sells the gap
  // between them as distance rather than decoration.
  (function () {
    if (!window.matchMedia) return;
    if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var img = document.querySelector('.portrait .shot');
    var bars = document.getElementById('bars');
    var x = 0, y = 0, queued = false;

    function paint() {
      queued = false;

      if (img) {
        // leans away from the pointer and turns to face it
        img.style.setProperty('--px', ((0.5 - x) * 18).toFixed(1) + 'px');
        img.style.setProperty('--py', ((0.5 - y) * 12).toFixed(1) + 'px');
        img.style.setProperty('--ry', ((x - 0.5) * 11).toFixed(2) + 'deg');
        img.style.setProperty('--rx', ((0.5 - y) * 8).toFixed(2) + 'deg');
      }

      // the field drifts with the pointer while the portrait drifts against
      // it, which is what sells the gap between them as depth
      if (bars) {
        bars.style.setProperty('--bx', ((x - 0.5) * 26).toFixed(1) + 'px');
        bars.style.setProperty('--by', ((y - 0.5) * 16).toFixed(1) + 'px');
      }
    }

    addEventListener('pointermove', function (e) {
      x = e.clientX / innerWidth;
      y = e.clientY / innerHeight;
      if (!queued) { queued = true; requestAnimationFrame(paint); }
    }, { passive: true });
  })();

  // Chrome buffers console output, so this is waiting whenever devtools opens
  (function () {
    // same recipe as the badges on the page: text in the hue, a dark wash
    // of it behind, and a lighter edge of the same
    console.log(
      '%c YOU are not in the sudoers file. This incident will be reported. ',
      'color:#ff3b30;' +
      'background:rgba(255,59,48,.15);' +
      'border:1px solid rgba(255,59,48,.45);' +
      'border-radius:3px;' +
      // inline-block first, or the vertical margin is ignored the way it
      // would be on any inline element
      'display:inline-block;' +
      'margin:14px 0;' +
      'padding:10px 12px;' +
      'font:400 14px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;' +
      'letter-spacing:.02em;'
    );
  })();
</script>
