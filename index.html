<script>
  // The portrait's backdrop is a field of red data bars. The page paints the
  // same field behind everything so the portrait has no edge to give it away.
  (function () {
    var layer = document.getElementById('bars');
    if (!layer) return;

    var seed = 20260825;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    var cols = 88, out = '';
    for (var c = 0; c < cols; c++) {
      var x = (c / cols) * 100 + rnd() * 0.4;
      var w = 0.10 + rnd() * 0.34;
      var y = rnd() * 100;
      var n = 3 + Math.floor(rnd() * 8);
      for (var i = 0; i < n; i++) {
        var h = 0.5 + rnd() * 6;
        y = (y + h + 2 + rnd() * 13) % 100;
        // a few bright filaments, the rest banked well down
        var hot = rnd() > 0.9;
        out += '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) +
               '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) +
               '" fill="' + (hot ? '#fc0000' : '#cf0101') +
               '"' + (hot ? ' class="hot"' : '') +
               ' style="--o:' + ((hot ? 0.55 : 0.08) + rnd() * 0.38).toFixed(2) +
               (hot ? ';animation-delay:' + (rnd() * 14).toFixed(1) + 's' : '') + '"/>';
      }
    }

    layer.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' + out + '</svg>';
  })();

  // Badges and the name borrow the filaments' failing-tube stutter. Long,
  // desynced cycles so they never blink together and it stays a surprise.
  (function () {
    if (window.matchMedia &&
        matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var seed = 987654321;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    function stutter(el, minDur, spanDur, minDel, spanDel) {
      el.style.setProperty('--dur', (minDur + rnd() * spanDur).toFixed(1) + 's');
      el.style.setProperty('--del', (minDel + rnd() * spanDel).toFixed(1) + 's');
      el.classList.add('flicker');
    }

    // starts well after the rows have finished arriving
    [].forEach.call(document.querySelectorAll('.tag'), function (el) {
      stutter(el, 17, 28, 4, 24);
    });

    // the name only once it has finished flying in
    [].forEach.call(document.querySelectorAll('.name span'), function (el) {
      el.addEventListener('animationend', function () {
        stutter(el, 21, 18, 3, 11);
      }, { once: true });
    });
  })();

  // One pointer drives the whole depth stack: the portrait turns to face it
  // while the bar field slides the other way, which is what sells the gap
  // between them as distance rather than decoration.
  (function () {
    if (!window.matchMedia) return;
    if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var img = document.querySelector('.portrait img');
    var bars = document.getElementById('bars');
    var x = 0, y = 0, queued = false;

    function paint() {
      queued = false;

      if (img) {
        // leans away from the pointer and turns to face it
        img.style.setProperty('--px', ((0.5 - x) * 18).toFixed(1) + 'px');
        img.style.setProperty('--py', ((0.5 - y) * 12).toFixed(1) + 'px');
        img.style.setProperty('--ry', ((x - 0.5) * 11).toFixed(2) + 'deg');
        img.style.setProperty('--rx', ((0.5 - y) * 8).toFixed(2) + 'deg');
      }

      // the field drifts with the pointer while the portrait drifts against
      // it, which is what sells the gap between them as depth
      if (bars) {
        bars.style.setProperty('--bx', ((x - 0.5) * 26).toFixed(1) + 'px');
        bars.style.setProperty('--by', ((y - 0.5) * 16).toFixed(1) + 'px');
      }
    }

    addEventListener('pointermove', function (e) {
      x = e.clientX / innerWidth;
      y = e.clientY / innerHeight;
      if (!queued) { queued = true; requestAnimationFrame(paint); }
    }, { passive: true });
  })();
</script>
